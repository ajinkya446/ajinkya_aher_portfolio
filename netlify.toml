# 1. Build Settings
[build]
  # Netlify does not include Flutter by default.
  # This command works using the plugin below.
  command = "flutter build web --release"
  publish = "build/web"

# 2. Flutter SDK Plugin
# This plugin automatically installs the Flutter SDK on the Netlify build server.
[[plugins]]
  package = "netlify-plugin-flutter"
  [plugins.inputs]
    channel = "stable"

# 3. SPA Routing (Redirects)
# Ensures that refreshing a sub-page doesn't return a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 4. Performance & Modern Rendering Headers
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 5. Caching Strategy for Heavy Assets
[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.wasm"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
