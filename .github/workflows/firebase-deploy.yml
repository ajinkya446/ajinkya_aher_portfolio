name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - master  # Your default branch
      - main    # Your default branch
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Jaspr CLI
        run: dart pub global activate jaspr_cli

      - name: Install dependencies
        run: dart pub get

      - name: Build Jaspr project
        run: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          jaspr build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_AJINKYA_PORTFOLIO_68BE0 }}'
          channelId: live
          projectId: ajinkya-portfolio-68be0
